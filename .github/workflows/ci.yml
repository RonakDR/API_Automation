
name: API Automation Github Action workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 24
      uses: actions/setup-java@v4
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: maven
    - name: test with Maven
      run: mvn test -DsuiteXmlFile=testng.xml -Denv=QA
      
    - name: Upload a Build Artifact
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: surefire report
        path: target/surefire reports/
        retention-days: 10
          
